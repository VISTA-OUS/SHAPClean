selection_feature:
  # evaluation_seeds: the 5 evaluation seeds - each seed rebuilds the poisoned sets, reselects the features and
  #   retrains every model; the paper's numbers come from these seeds.
  evaluation_seeds:
    - 8459
    - 1563
    - 9767
    - 4714
    - 3366
  # execution_n_jobs: parallel workers of mRMR - an execution parameter only, results do not change.
  execution_n_jobs: 4
  # techniques.mrmr: mRMR (Peng, Long, Ding 2005, IEEE TPAMI) in its MID form - mutual information for both relevance
  #   and redundancy (fixed in src/feature_selection/mrmr_selector.py); ranks on a stratified subsample of sample_size
  #   rows for each seed of the sampling seed set and merges the ranks with Borda. sample_size only caps run time.
  techniques:
    mrmr:
      denominator: mean
      sample_size: 30000
